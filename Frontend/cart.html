<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PharmaConnect — Cart</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
  
  
  
</head>
<body>

<nav>
  <div class="nav-logo" onclick="window.location='index.html'">
    <span></span>Pharma<span>Connect</span>
  </div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="medicine.html">Medicines</a></li>
    <li><a href="cart.html" class="active">Cart</a></li>
    <li><a href="profile.html">Profile</a></li>
  </ul>
  <div class="nav-right">
    <button class="cart-btn" onclick="window.location='cart.html'">🛒<span class="cart-badge" id="cart-count">0</span></button>
    <button class="btn-nav-login" onclick="window.location='login.html'">Sign In</button>
  </div>
</nav>

<div class="toast" id="toast"><span></span><span id="toast-msg"></span></div>

<div class="page-header">
  <h1>🛒 Your Cart</h1>
  <p>Review your medicines before checkout</p>
</div>

<div class="cart-layout">
  <div>
    <div class="cart-items-wrap">
      <div class="cart-items-header">
        <span>Cart Items</span>
        <span id="cart-item-count" style="font-size:.85rem;color:var(--gray-500);font-weight:500;">0 items</span>
      </div>
      <div id="cart-items-list"></div>
    </div>
  </div>
  <div>
    <div class="order-summary">
      <h3>Order Summary</h3>
      <div class="summary-row"><span>Subtotal</span><span id="summary-sub">RWF 0</span></div>
      <div class="summary-row"><span>Delivery</span><span style="color:var(--green)">Free</span></div>
      <div class="summary-row"><span>Discount</span><span>RWF 0</span></div>
      <input class="promo-input" type="text" placeholder="Enter promo code">
      <div class="summary-row total"><span>Total</span><span id="summary-total">RWF 0</span></div>
      <button class="checkout-btn" onclick="checkout()">Proceed to Checkout →</button>
      <p style="font-size:.75rem;color:var(--gray-500);text-align:center;margin-top:12px;">Secured by AES-256 encryption</p>
    </div>
  </div>
</div>

<script src="../js/cart.js"></script>
</body>
</html>
